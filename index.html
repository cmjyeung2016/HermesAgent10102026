<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Web App 導覽 · Jimmy</title>
<meta name="description" content="集中管理所有網頁應用：搜尋、分類與狀態一覽無遺。" />
<style>
  :root{
    --bg1:#eef2ff; --bg2:#f8fafc;
    --card:#ffffff; --card-border:rgba(15,23,42,.07);
    --text:#0f172a; --muted:#64748b; --faint:#94a3b8;
    --accent:#6366f1; --accent-2:#8b5cf6;
    --accent-soft:rgba(99,102,241,.10);
    --hover:rgba(15,23,42,.045);
    --track:rgba(15,23,42,.08);
    --ring:rgba(99,102,241,.35);
    --live:#16a34a; --live-bg:rgba(22,163,74,.12);
    --dev:#d97706; --dev-bg:rgba(217,119,6,.14);
    --shadow:0 18px 44px -22px rgba(30,41,59,.4), 0 4px 12px -6px rgba(30,41,59,.12);
    --radius:18px;
  }
  [data-theme="dark"]{
    --bg1:#0b1120; --bg2:#0f172a;
    --card:#151f31; --card-border:rgba(148,163,184,.13);
    --text:#f1f5f9; --muted:#94a3b8; --faint:#64748b;
    --accent:#818cf8; --accent-2:#a78bfa;
    --accent-soft:rgba(129,140,248,.14);
    --hover:rgba(148,163,184,.08);
    --track:rgba(148,163,184,.12);
    --ring:rgba(129,140,248,.4);
    --live:#4ade80; --live-bg:rgba(74,222,128,.14);
    --dev:#fbbf24; --dev-bg:rgba(251,191,36,.14);
    --shadow:0 22px 54px -24px rgba(0,0,0,.75), 0 4px 14px -8px rgba(0,0,0,.6);
  }
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang TC","Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;
    color:var(--text);
    background:
      radial-gradient(1100px 640px at 10% -8%, var(--accent-soft), transparent 55%),
      radial-gradient(900px 560px at 100% 0%, var(--accent-soft), transparent 50%),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{ max-width:1080px; margin:0 auto; padding:44px 20px 64px; }

  header.top{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
  h1{
    margin:0; font-size:clamp(26px,4vw,34px); font-weight:800; letter-spacing:-.02em; line-height:1.15;
    background:linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .tagline{ margin:8px 0 0; font-size:14.5px; color:var(--muted); max-width:560px; line-height:1.55; }
  .meta{ margin:6px 0 0; font-size:12px; color:var(--faint); font-weight:600; }

  .icon-btn{
    flex:none; width:42px; height:42px; border-radius:12px;
    border:1px solid var(--card-border); background:var(--hover); color:var(--muted);
    cursor:pointer; display:grid; place-items:center;
    transition:transform .15s ease, background .2s ease, color .2s ease;
  }
  .icon-btn:hover{ color:var(--text); transform:translateY(-1px); }
  .icon-btn svg{ width:19px; height:19px; }
  [data-theme="light"] .icon-btn .moon{ display:none; }
  [data-theme="dark"] .icon-btn .sun{ display:none; }

  /* Toolbar */
  .toolbar{ margin:26px 0 8px; display:flex; flex-direction:column; gap:12px; }
  .search{
    position:relative; display:flex; align-items:center;
  }
  .search svg{ position:absolute; left:15px; width:18px; height:18px; color:var(--faint); pointer-events:none; }
  .search input{
    width:100%; font:inherit; font-size:15px; color:var(--text);
    background:var(--card); border:1px solid var(--card-border); border-radius:14px;
    padding:13px 44px 13px 44px; outline:none;
    box-shadow:0 2px 10px -6px rgba(30,41,59,.25);
    transition:border-color .2s, box-shadow .2s;
  }
  .search input::placeholder{ color:var(--faint); }
  .search input:focus{ border-color:var(--accent); box-shadow:0 0 0 4px var(--ring); }
  .search .clear-search{
    position:absolute; right:10px; width:28px; height:28px; border-radius:8px; border:none;
    background:var(--hover); color:var(--muted); cursor:pointer; display:none; place-items:center;
  }
  .search.has-value .clear-search{ display:grid; }
  .search .clear-search:hover{ color:var(--text); }
  .search .clear-search svg{ width:14px; height:14px; position:static; }

  .filters{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .fgroup{ display:flex; gap:6px; flex-wrap:wrap; }
  .fsep{ width:1px; height:22px; background:var(--card-border); margin:0 4px; }
  .pill{
    font:inherit; font-size:13px; font-weight:600; color:var(--muted);
    background:var(--card); border:1px solid var(--card-border); border-radius:99px;
    padding:7px 14px; cursor:pointer; transition:all .16s ease;
  }
  .pill:hover{ color:var(--text); background:var(--hover); }
  .pill.active{
    color:#fff; background:linear-gradient(135deg, var(--accent), var(--accent-2));
    border-color:transparent; box-shadow:0 6px 14px -8px var(--accent);
  }
  .pill .cnt{ margin-left:5px; font-size:11px; opacity:.75; }
  .reset-btn{
    font:inherit; font-size:13px; font-weight:600; color:var(--accent);
    background:transparent; border:none; cursor:pointer; padding:7px 10px; border-radius:8px;
  }
  .reset-btn:hover{ background:var(--accent-soft); }

  .result-meta{ margin:14px 2px 10px; font-size:13px; color:var(--faint); font-weight:600; }

  /* Grid */
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:18px; }
  .card{
    display:flex; flex-direction:column; gap:12px;
    background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius);
    padding:20px; box-shadow:var(--shadow);
    transition:transform .2s ease, border-color .2s ease;
    animation:enter .4s cubic-bezier(.16,1,.3,1) both;
  }
  .card:hover{ transform:translateY(-3px); border-color:var(--ring); }
  @keyframes enter{ from{ opacity:0; transform:translateY(12px);} to{ opacity:1; transform:none;} }
  .card-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .card h2{ margin:0; font-size:17px; font-weight:750; line-height:1.3; letter-spacing:-.01em; }
  .badge{
    flex:none; display:inline-flex; align-items:center; gap:6px;
    font-size:11.5px; font-weight:700; border-radius:99px; padding:5px 11px; white-space:nowrap;
  }
  .badge .dot{ width:7px; height:7px; border-radius:50%; background:currentColor; }
  .badge.live{ color:var(--live); background:var(--live-bg); }
  .badge.dev{ color:var(--dev); background:var(--dev-bg); }
  .badge.other{ color:var(--muted); background:var(--hover); }
  .card p.desc{ margin:0; font-size:14px; line-height:1.6; color:var(--muted); flex:1; }
  .tech{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{
    font-size:11.5px; font-weight:600; color:var(--accent);
    background:var(--accent-soft); border-radius:7px; padding:4px 9px;
  }
  .card-foot{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    border-top:1px solid var(--card-border); padding-top:12px; margin-top:2px;
  }
  .cat{ font-size:12px; font-weight:600; color:var(--faint); }
  .open-link{
    display:inline-flex; align-items:center; gap:6px;
    font:inherit; font-size:13.5px; font-weight:700; color:var(--text); text-decoration:none;
    background:transparent; border:none; cursor:pointer; padding:6px 10px; border-radius:9px;
    transition:all .16s ease;
  }
  .open-link:hover{ color:var(--accent); background:var(--accent-soft); }
  .open-link svg{ width:15px; height:15px; }
  .soon{ font-size:12.5px; font-weight:600; color:var(--faint); }

  /* Empty / error states */
  .state{ text-align:center; padding:52px 12px; color:var(--faint); }
  .state .emoji{ font-size:38px; margin-bottom:10px; filter:grayscale(.25); }
  .state p{ margin:0; font-size:15px; font-weight:500; }
  .state .sub{ margin-top:8px; font-size:13px; }

  footer{
    margin-top:44px; padding-top:18px; border-top:1px solid var(--card-border);
    display:flex; flex-wrap:wrap; gap:8px; justify-content:space-between;
    font-size:12px; color:var(--faint);
  }
  .hint a{ color:var(--accent); text-decoration:none; font-weight:600; }

  :focus-visible{ outline:3px solid var(--ring); outline-offset:2px; border-radius:8px; }
  @media (prefers-reduced-motion:reduce){ *{ animation-duration:.001ms !important; transition-duration:.001ms !important; } }

  /* Print */
  @media print{
    :root{ --bg1:#fff; --bg2:#fff; --card:#fff; --shadow:none; }
    body{ background:#fff !important; }
    .toolbar, .icon-btn, footer .hint{ display:none !important; }
    .card{ box-shadow:none; border:1px solid #cbd5e1; break-inside:avoid; }
    .grid{ grid-template-columns:repeat(2,1fr); gap:12px; }
    .wrap{ padding:0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 id="siteTitle">Web App 導覽</h1>
      <p class="tagline" id="siteTagline"></p>
      <p class="meta" id="siteMeta"></p>
    </div>
    <button id="themeToggle" class="icon-btn" aria-label="切換深淺色主題" type="button">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <div class="toolbar">
    <div class="search" id="searchBox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="searchInput" type="search" placeholder="搜尋專案名稱、簡介或技術…" autocomplete="off" aria-label="搜尋專案" />
      <button class="clear-search" id="clearSearch" type="button" aria-label="清除搜尋">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="filters">
      <div class="fgroup" id="catFilters" role="group" aria-label="按分類篩選"></div>
      <div class="fsep" aria-hidden="true"></div>
      <div class="fgroup" id="statusFilters" role="group" aria-label="按狀態篩選"></div>
      <button class="reset-btn" id="resetBtn" type="button">重設篩選</button>
    </div>
  </div>

  <p class="result-meta" id="resultMeta" role="status" aria-live="polite"></p>

  <main id="grid" class="grid" aria-label="專案清單"></main>

  <div id="stateEmpty" class="state" hidden>
    <div class="emoji">🔍</div>
    <p>找不到符合條件的專案</p>
    <p class="sub">請調整搜尋詞或重設篩選</p>
  </div>
  <div id="stateError" class="state" hidden>
    <div class="emoji">⚠️</div>
    <p id="errMsg"></p>
    <p class="sub">新增專案請修改倉庫中的 projects.json，再以 HTTP 方式開啟本站</p>
  </div>

  <footer>
    <span id="footCount"></span>
    <span class="hint">管理專案清單：<a href="projects.json" target="_blank" rel="noopener">projects.json</a>（純文字檔，可直接編輯）</span>
  </footer>
</div>

<script>
(function(){
  "use strict";
  var THEME_KEY = "navigator.theme";
  var grid = document.getElementById("grid");
  var searchInput = document.getElementById("searchInput");
  var searchBox = document.getElementById("searchBox");
  var catBox = document.getElementById("catFilters");
  var statusBox = document.getElementById("statusFilters");
  var resetBtn = document.getElementById("resetBtn");
  var resultMeta = document.getElementById("resultMeta");
  var footCount = document.getElementById("footCount");
  var emptyEl = document.getElementById("stateEmpty");
  var errEl = document.getElementById("stateError");
  var errMsg = document.getElementById("errMsg");

  var STATUS_LABEL = { live:"已上線", dev:"開發中" };
  var projects = [], categories = [], state = { q:"", cat:"all", status:"all" };

  // ---- theme ----
  function applyTheme(t){ document.documentElement.setAttribute("data-theme", t); try{ localStorage.setItem(THEME_KEY, t); }catch(e){} }
  (function(){
    var stored = null; try{ stored = localStorage.getItem(THEME_KEY); }catch(e){}
    if(stored === "dark" || stored === "light"){ applyTheme(stored); return; }
    var mq = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");
    applyTheme(mq && mq.matches ? "dark" : "light");
  })();
  document.getElementById("themeToggle").addEventListener("click", function(){
    applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
  });

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function buildFilters(){
    // categories (dynamic from data)
    catBox.innerHTML = "";
    addPill(catBox, "all", "全部分類", projects.length, "cat");
    categories.forEach(function(c){
      var n = projects.filter(function(p){ return p.category === c; }).length;
      addPill(catBox, c, c, n, "cat");
    });
    // statuses
    var present = ["live","dev"].filter(function(s){ return projects.some(function(p){ return p.status === s; }); });
    var unknown = [];
    projects.forEach(function(p){ if(p.status && present.indexOf(p.status) === -1 && unknown.indexOf(p.status) === -1) unknown.push(p.status); });
    statusBox.innerHTML = "";
    addPill(statusBox, "all", "全部狀態", projects.length, "status");
    present.forEach(function(s){
      var n = projects.filter(function(p){ return p.status === s; }).length;
      addPill(statusBox, s, STATUS_LABEL[s] || s, n, "status");
    });
    unknown.forEach(function(s){
      var n = projects.filter(function(p){ return p.status === s; }).length;
      addPill(statusBox, s, s, n, "status");
    });
  }

  function addPill(parent, key, label, count, group){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "pill";
    b.dataset.group = group;
    b.dataset.value = key;
    b.setAttribute("aria-pressed", state[group] === key ? "true" : "false");
    b.innerHTML = esc(label) + '<span class="cnt">' + count + '</span>';
    b.addEventListener("click", function(){
      state[group] = key;
      syncPills();
      render();
    });
    parent.appendChild(b);
  }

  function syncPills(){
    catBox.querySelectorAll(".pill").forEach(function(b){
      var on = state.cat === b.dataset.value;
      b.classList.toggle("active", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
    statusBox.querySelectorAll(".pill").forEach(function(b){
      var on = state.status === b.dataset.value;
      b.classList.toggle("active", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
  }

  function matches(p){
    var q = state.q.trim().toLowerCase();
    if(q){
      var hay = [p.name, p.description, (p.tech||[]).join(" "), p.category, STATUS_LABEL[p.status]||p.status].join(" ").toLowerCase();
      if(hay.indexOf(q) === -1) return false;
    }
    if(state.cat !== "all" && p.category !== state.cat) return false;
    if(state.status !== "all" && p.status !== state.status) return false;
    return true;
  }

  function cardHTML(p, i){
    var label = STATUS_LABEL[p.status] || (p.status || "未標示");
    var cls = p.status === "live" ? "live" : (p.status === "dev" ? "dev" : "other");
    var chips = (p.tech||[]).map(function(t){ return '<span class="chip">' + esc(t) + '</span>'; }).join("");
    var link = "";
    if(p.url){
      var ext = p.external || String(p.url).indexOf("http") === 0;
      var tgt = ext ? ' target="_blank" rel="noopener" ' : "";
      var icon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>';
      link = '<a class="open-link" href="' + esc(p.url) + '"' + tgt + '>開啟專案' + icon + '</a>';
    } else {
      link = '<span class="soon">尚未發布</span>';
    }
    return '<article class="card" style="animation-delay:' + (i*45) + 'ms">' +
      '<div class="card-top"><h2>' + esc(p.name) + '</h2>' +
      '<span class="badge ' + cls + '"><span class="dot"></span>' + esc(label) + '</span></div>' +
      '<p class="desc">' + esc(p.description || "") + '</p>' +
      (chips ? '<div class="tech" aria-label="技術堆疊">' + chips + '</div>' : "") +
      '<div class="card-foot"><span class="cat">分類：' + esc(p.category || "未分類") + '</span>' + link + '</div>' +
      '</article>';
  }

  function render(){
    var list = projects.filter(matches);
    grid.innerHTML = list.map(cardHTML).join("");
    emptyEl.hidden = list.length > 0;
    var active = state.q || state.cat !== "all" || state.status !== "all";
    resultMeta.textContent = active
      ? "顯示 " + list.length + " / " + projects.length + " 個專案（篩選中）"
      : "共 " + projects.length + " 個專案";
    footCount.textContent = "最後更新：" + (projects.__meta_updated || "未知日期");
  }

  // ---- events ----
  searchInput.addEventListener("input", function(){
    state.q = searchInput.value;
    searchBox.classList.toggle("has-value", !!searchInput.value);
    render();
  });
  document.getElementById("clearSearch").addEventListener("click", function(){
    searchInput.value = ""; state.q = "";
    searchBox.classList.remove("has-value");
    render(); searchInput.focus();
  });
  resetBtn.addEventListener("click", function(){
    state = { q:"", cat:"all", status:"all" };
    searchInput.value = "";
    searchBox.classList.remove("has-value");
    syncPills(); render();
  });

  // ---- load ----
  fetch("projects.json", { cache:"no-store" })
    .then(function(r){
      if(!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function(d){
      var site = d.site || {};
      document.getElementById("siteTitle").textContent = site.title || "Web App 導覽";
      document.getElementById("siteTagline").textContent = site.tagline || "";
      document.getElementById("siteMeta").textContent = "資料來源：projects.json" + (site.updated ? " · 最後更新 " + site.updated : "");
      document.title = (site.title ? site.title + " · " : "") + "Web App 導覽";
      projects = Array.isArray(d.projects) ? d.projects : [];
      projects.__meta_updated = site.updated || "（檔案未標示日期）";
      categories = projects.reduce(function(acc,p){ var c = p.category || "未分類"; if(acc.indexOf(c)===-1) acc.push(c); return acc; }, []);
      buildFilters(); syncPills(); render();
    })
    .catch(function(e){
      grid.innerHTML = "";
      errEl.hidden = false;
      errMsg.textContent = "無法讀取 projects.json（" + e.message + "）。此頁面需透過 HTTP 伺服器開啟；直接雙擊檔案（file://）時瀏覽器會阻擋讀取。";
    });
})();
</script>
</body>
</html>

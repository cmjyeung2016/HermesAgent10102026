# Automated build & deploy to GitHub Pages.
# Runs on every push to the default branch and via manual "Run workflow".
# No external build tooling is required (pure static HTML), so the "build"
# step validates the artifact before it is handed to the Pages artifact.
name: Build & deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# GITHUB_TOKEN permissions needed for Pages deployment (job level).
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a new push supersedes an in-flight one.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build / validate site
        # Pure static site — confirm the entry point exists so a broken
        # content push fails fast instead of deploying a 404 page.
        run: |
          test -f index.html || { echo "::error::index.html is missing"; exit 1; }
          echo "index.html present — building static artifact"
          # (Hook your real build here, e.g. `npm ci && npm run build`.)

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages (Actions source) on first run; the GITHUB_TOKEN
          # carries the `pages: write` permission declared above. Safe on
          # subsequent runs (idempotent).
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

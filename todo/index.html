<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>待辦清單 · Todo</title>
<meta name="description" content="A modern, self-contained Todo list web app." />
<style>
  :root{
    --bg1:#eef2ff;
    --bg2:#f8fafc;
    --card:#ffffff;
    --card-border:rgba(15,23,42,.06);
    --text:#0f172a;
    --muted:#64748b;
    --faint:#94a3b8;
    --accent:#6366f1;
    --accent-2:#8b5cf6;
    --accent-soft:rgba(99,102,241,.10);
    --done:#94a3b8;
    --danger:#ef4444;
    --track:rgba(15,23,42,.08);
    --hover:rgba(15,23,42,.04);
    --ring:rgba(99,102,241,.35);
    --shadow:0 20px 50px -20px rgba(30,41,59,.35), 0 4px 12px -6px rgba(30,41,59,.15);
    --radius:22px;
  }
  [data-theme="dark"]{
    --bg1:#0b1120;
    --bg2:#0f172a;
    --card:#151f31;
    --card-border:rgba(148,163,184,.12);
    --text:#f1f5f9;
    --muted:#94a3b8;
    --faint:#64748b;
    --accent:#818cf8;
    --accent-2:#a78bfa;
    --accent-soft:rgba(129,140,248,.14);
    --done:#64748b;
    --danger:#f87171;
    --track:rgba(148,163,184,.12);
    --hover:rgba(148,163,184,.08);
    --ring:rgba(129,140,248,.4);
    --shadow:0 24px 60px -22px rgba(0,0,0,.7), 0 4px 14px -8px rgba(0,0,0,.6);
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","Noto Sans",Arial,sans-serif;
    color:var(--text);
    background:
      radial-gradient(1200px 700px at 12% -10%, var(--accent-soft), transparent 55%),
      radial-gradient(1000px 600px at 100% 0%, var(--accent-soft), transparent 50%),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
    display:flex; align-items:flex-start; justify-content:center;
    padding:48px 16px;
    transition:background .4s ease, color .3s ease;
  }
  [data-theme="dark"] body{ }

  .app{
    width:100%;
    max-width:560px;
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:26px 24px 22px;
    transition:background .35s ease, border-color .35s ease;
  }

  /* Header */
  .app-header{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
  .title-wrap h1{
    margin:0; font-size:26px; font-weight:800; letter-spacing:-.02em; line-height:1.1;
    background:linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .sub{ margin:6px 0 0; font-size:13.5px; color:var(--muted); font-weight:500; }

  .icon-btn{
    flex:none; width:42px; height:42px; border-radius:13px;
    border:1px solid var(--card-border); background:var(--hover);
    color:var(--muted); cursor:pointer; display:grid; place-items:center;
    transition:transform .15s ease, background .2s ease, color .2s ease, box-shadow .2s ease;
  }
  .icon-btn:hover{ color:var(--text); transform:translateY(-1px); box-shadow:0 6px 16px -8px rgba(0,0,0,.4); }
  .icon-btn:active{ transform:translateY(0) scale(.96); }
  .icon-btn svg{ width:20px; height:20px; }
  [data-theme="light"] .icon-btn .moon{ display:none; }
  [data-theme="dark"] .icon-btn .sun{ display:none; }

  /* Progress */
  .progress{ margin:20px 0 16px; }
  .progress-track{
    height:7px; border-radius:99px; background:var(--track); overflow:hidden;
  }
  .progress-fill{
    height:100%; width:0;
    background:linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius:99px; transition:width .5s cubic-bezier(.4,0,.2,1);
  }
  .progress-label{ display:flex; justify-content:space-between; margin-top:8px; font-size:12px; color:var(--faint); font-weight:600; }

  /* Add form */
  .add{ display:flex; gap:10px; }
  .add input{
    flex:1; min-width:0; font:inherit; font-size:15.5px; color:var(--text);
    background:var(--hover); border:1px solid var(--card-border); border-radius:14px;
    padding:13px 15px; outline:none; transition:border-color .2s, box-shadow .2s, background .2s;
  }
  .add input::placeholder{ color:var(--faint); }
  .add input:focus{ border-color:var(--accent); box-shadow:0 0 0 4px var(--ring); background:var(--card); }
  .add-btn{
    flex:none; width:50px; border-radius:14px; border:none; cursor:pointer;
    background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:#fff;
    display:grid; place-items:center; box-shadow:0 8px 18px -8px var(--accent);
    transition:transform .15s ease, filter .2s ease;
  }
  .add-btn:hover{ filter:brightness(1.06); }
  .add-btn:active{ transform:scale(.94); }
  .add-btn svg{ width:22px; height:22px; }

  /* Filters */
  .filters{ display:flex; gap:8px; margin:18px 0 6px; }
  .filter-btn{
    font:inherit; font-size:13px; font-weight:600; color:var(--muted);
    background:transparent; border:1px solid var(--card-border); border-radius:99px;
    padding:7px 14px; cursor:pointer; transition:all .18s ease;
  }
  .filter-btn:hover{ color:var(--text); background:var(--hover); }
  .filter-btn.active{
    color:#fff; background:linear-gradient(135deg, var(--accent), var(--accent-2));
    border-color:transparent; box-shadow:0 6px 14px -8px var(--accent);
  }
  .filter-btn .badge{
    margin-left:6px; font-size:11px; font-weight:700; opacity:.8;
  }

  /* List */
  .list{ list-style:none; margin:14px 0 0; padding:0; display:flex; flex-direction:column; gap:10px; }
  .task{
    display:flex; align-items:center; gap:12px;
    background:var(--hover); border:1px solid var(--card-border);
    border-radius:15px; padding:12px 14px;
    animation:enter .32s cubic-bezier(.16,1,.3,1) both;
    transition:opacity .28s ease, transform .28s ease, background .2s ease, border-color .2s ease;
  }
  .task:hover{ background:var(--hover); border-color:var(--ring); }
  .task.hidden{ display:none; }
  .task.removing{ opacity:0; transform:translateX(24px) scale(.98); }
  @keyframes enter{
    from{ opacity:0; transform:translateY(10px) scale(.98); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  .check{
    flex:none; width:24px; height:24px; border-radius:8px; cursor:pointer;
    border:2px solid var(--faint); background:transparent; padding:0;
    display:grid; place-items:center; transition:all .2s cubic-bezier(.4,0,.2,1);
  }
  .check:hover{ border-color:var(--accent); }
  .check svg{ width:14px; height:14px; stroke:#fff; stroke-width:3; fill:none;
    stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray:24; stroke-dashoffset:24; transition:stroke-dashoffset .3s ease .05s; }
  .task.done .check{ background:linear-gradient(135deg, var(--accent), var(--accent-2)); border-color:transparent; }
  .task.done .check svg{ stroke-dashoffset:0; }

  .task-text{
    flex:1; font-size:15px; line-height:1.4; font-weight:500; color:var(--text);
    word-break:break-word; min-height:21px; cursor:text;
    border-radius:6px; padding:2px 4px; outline:none; transition:color .2s ease, background .2s ease;
  }
  .task.done .task-text{ color:var(--done); text-decoration:line-through; text-decoration-color:var(--faint); }
  .task-text[contenteditable="true"]{ background:var(--accent-soft); }

  .del{
    flex:none; width:34px; height:34px; border-radius:10px; border:none; background:transparent;
    color:var(--faint); cursor:pointer; display:grid; place-items:center;
    opacity:0; transform:translateX(6px); transition:all .18s ease;
  }
  .task:hover .del, .del:focus{ opacity:1; transform:translateX(0); }
  .del:hover{ color:var(--danger); background:rgba(239,68,68,.10); }
  .del:active{ transform:scale(.9); }
  .del svg{ width:18px; height:18px; }
  @media (hover:none){ .del{ opacity:1; transform:none; } }

  /* Empty */
  .empty{ text-align:center; padding:38px 10px; color:var(--faint); }
  .empty-emoji{ font-size:38px; margin-bottom:10px; filter:grayscale(.2); }
  .empty p{ margin:0; font-size:15px; font-weight:500; }

  /* Footer */
  .app-footer{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:18px; padding-top:16px; border-top:1px solid var(--card-border);
  }
  .count{ font-size:13.5px; color:var(--muted); font-weight:500; }
  .count b{ color:var(--text); font-weight:800; }
  .clear{
    font:inherit; font-size:13px; font-weight:600; color:var(--muted);
    background:transparent; border:none; cursor:pointer; padding:6px 10px; border-radius:9px;
    transition:all .18s ease;
  }
  .clear:hover:not(:disabled){ color:var(--danger); background:rgba(239,68,68,.08); }
  .clear:disabled{ opacity:.4; cursor:not-allowed; }

  /* Focus visibility */
  .filter-btn:focus-visible, .clear:focus-visible, .check:focus-visible, .del:focus-visible{
    outline:3px solid var(--ring); outline-offset:2px;
  }
  @media (prefers-reduced-motion:reduce){
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }
</style>
</head>
<body>
  <main class="app" id="app">
    <header class="app-header">
      <div class="title-wrap">
        <h1>待辦清單</h1>
        <p class="sub" id="today"></p>
      </div>
      <button id="themeToggle" class="icon-btn" aria-label="切換深淺色主題">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </header>

    <div class="progress">
      <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
      <div class="progress-label"><span id="pct">0%</span><span id="progText">0 / 0</span></div>
    </div>

    <form id="addForm" class="add">
      <input id="taskInput" type="text" placeholder="加入新任務…" maxlength="200" autocomplete="off" aria-label="新任務內容" />
      <button type="submit" class="add-btn" aria-label="加入任務">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </form>

    <div class="filters" role="tablist" aria-label="任務篩選">
      <button data-filter="all" class="filter-btn active">全部<span class="badge" data-badge="all"></span></button>
      <button data-filter="active" class="filter-btn">進行中<span class="badge" data-badge="active"></span></button>
      <button data-filter="done" class="filter-btn">已完成<span class="badge" data-badge="done"></span></button>
    </div>

    <ul id="list" class="list"></ul>

    <div id="empty" class="empty" hidden>
      <div class="empty-emoji" id="emptyEmoji">✨</div>
      <p id="emptyText"></p>
    </div>

    <footer class="app-footer">
      <span class="count"><b id="remaining">0</b> 項待辦</span>
      <button id="clearDone" class="clear" disabled>清除已完成</button>
    </footer>
  </main>

<script>
(function(){
  "use strict";
  var STORAGE_KEY = "todoapp.v1";
  var THEME_KEY = "todoapp.theme";

  var listEl = document.getElementById("list");
  var inputEl = document.getElementById("taskInput");
  var addForm = document.getElementById("addForm");
  var emptyEl = document.getElementById("empty");
  var emptyText = document.getElementById("emptyText");
  var emptyEmoji = document.getElementById("emptyEmoji");
  var remainingEl = document.getElementById("remaining");
  var clearBtn = document.getElementById("clearDone");
  var progFill = document.getElementById("progressFill");
  var progText = document.getElementById("progText");
  var pctEl = document.getElementById("pct");
  var filterBtns = Array.prototype.slice.call(document.querySelectorAll(".filter-btn"));

  var tasks = load();
  var filter = "all";

  // ---- persistence ----
  function load(){ try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch(e){ return []; } }
  function save(){ try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); } catch(e){} }
  function byId(id){ for(var i=0;i<tasks.length;i++){ if(tasks[i].id===id) return tasks[i]; } return null; }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  // ---- date ----
  function setToday(){
    var d = new Date();
    var names = ["週日","週一","週二","週三","週四","週五","週六"];
    document.getElementById("today").textContent =
      d.getFullYear() + " 年 " + (d.getMonth()+1) + " 月 " + d.getDate() + " 日 · " + names[d.getDay()];
  }

  // ---- theme ----
  function applyTheme(t){
    document.documentElement.setAttribute("data-theme", t);
    try { localStorage.setItem(THEME_KEY, t); } catch(e){}
  }
  function initTheme(){
    var stored = null;
    try { stored = localStorage.getItem(THEME_KEY); } catch(e){}
    if (stored === "dark" || stored === "light"){ applyTheme(stored); return; }
    var mq = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");
    applyTheme(mq && mq.matches ? "dark" : "light");
  }
  document.getElementById("themeToggle").addEventListener("click", function(){
    var cur = document.documentElement.getAttribute("data-theme");
    applyTheme(cur === "dark" ? "light" : "dark");
  });

  // ---- DOM builders ----
  var SVG_CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>';
  var SVG_TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6"/></svg>';

  function createItem(task){
    var li = document.createElement("li");
    li.className = "task" + (task.done ? " done" : "");
    li.dataset.id = task.id;
    li.dataset.status = task.done ? "done" : "active";

    var check = document.createElement("button");
    check.className = "check";
    check.type = "button";
    check.setAttribute("aria-label", task.done ? "標記為未完成" : "標記為已完成");
    check.innerHTML = SVG_CHECK;
    check.addEventListener("click", function(){ toggle(task.id); });

    var text = document.createElement("span");
    text.className = "task-text";
    text.textContent = task.text;
    text.title = "雙擊可編輯";
    text.addEventListener("dblclick", function(){ startEdit(li, text, task); });

    var del = document.createElement("button");
    del.className = "del";
    del.type = "button";
    del.setAttribute("aria-label", "刪除任務");
    del.innerHTML = SVG_TRASH;
    del.addEventListener("click", function(){ removeTask(task.id); });

    li.appendChild(check);
    li.appendChild(text);
    li.appendChild(del);
    return li;
  }

  // ---- actions ----
  function addTask(raw){
    var text = (raw || "").trim();
    if (!text) return;
    var task = { id: uid(), text: text, done: false, created: Date.now() };
    tasks.push(task);
    save();
    var li = createItem(task);
    listEl.appendChild(li);
    inputEl.value = "";
    applyFilter();
    updateMeta();
    inputEl.focus();
  }

  function toggle(id){
    var t = byId(id); if(!t) return;
    t.done = !t.done;
    save();
    var li = listEl.querySelector('.task[data-id="'+id+'"]');
    if(li){
      li.classList.toggle("done", t.done);
      li.dataset.status = t.done ? "done" : "active";
      var check = li.querySelector(".check");
      if(check) check.setAttribute("aria-label", t.done ? "標記為未完成" : "標記為已完成");
    }
    applyFilter();
    updateMeta();
  }

  function removeTask(id){
    var li = listEl.querySelector('.task[data-id="'+id+'"]');
    var doRemove = function(){
      var i = tasks.findIndex(function(t){ return t.id===id; });
      if(i>-1) tasks.splice(i,1);
      save();
      if(li && li.parentNode) li.parentNode.removeChild(li);
      applyFilter();
      updateMeta();
    };
    if(li){
      li.classList.add("removing");
      var finished = false;
      var fin = function(){ if(finished) return; finished = true; doRemove(); };
      li.addEventListener("animationend", fin, { once:true });
      setTimeout(fin, 320); // safety net
    } else { doRemove(); }
  }

  function clearDone(){
    var ids = tasks.filter(function(t){ return t.done; }).map(function(t){ return t.id; });
    ids.forEach(removeTask);
  }

  function startEdit(li, textEl, task){
    if(textEl.isContentEditable) return;
    textEl.contentEditable = "true";
    textEl.focus();
    var range = document.createRange();
    range.selectNodeContents(textEl);
    var sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(range);
    var finish = function(){
      textEl.contentEditable = "false";
      var v = textEl.textContent.replace(/\s+/g," ").trim();
      if(v && v !== task.text){ task.text = v; save(); }
      else { textEl.textContent = task.text; }
      textEl.removeEventListener("blur", finish);
      textEl.removeEventListener("keydown", onKey);
      updateMeta();
    };
    var onKey = function(e){
      if(e.key === "Enter"){ e.preventDefault(); textEl.blur(); }
      else if(e.key === "Escape"){ textEl.textContent = task.text; textEl.blur(); }
    };
    textEl.addEventListener("blur", finish);
    textEl.addEventListener("keydown", onKey);
  }

  // ---- filter + meta ----
  function applyFilter(){
    filterBtns.forEach(function(b){ b.classList.toggle("active", b.dataset.filter===filter); });
    var visible = 0;
    tasks.forEach(function(t){
      var li = listEl.querySelector('.task[data-id="'+t.id+'"]');
      if(!li) return;
      var show = filter==="all" || (filter==="active" ? !t.done : t.done);
      li.classList.toggle("hidden", !show);
      if(show) visible++;
    });
    // badges
    var total = tasks.length;
    var done = tasks.filter(function(t){return t.done;}).length;
    var active = total - done;
    setBadge("all", total);
    setBadge("active", active);
    setBadge("done", done);
    showEmpty(visible, total, done, active);
  }

  function setBadge(key, n){
    var el = document.querySelector('.badge[data-badge="'+key+'"]');
    if(!el) return;
    el.textContent = n > 0 ? n : "";
    el.style.display = n > 0 ? "inline" : "none";
  }

  function showEmpty(visible, total, done, active){
    if(visible > 0){ emptyEl.hidden = true; return; }
    emptyEl.hidden = false;
    if(total === 0){ emptyEmoji.textContent = "✨"; emptyText.textContent = "還沒有任務，加入第一項吧"; }
    else if(filter === "active"){ emptyEmoji.textContent = "🎉"; emptyText.textContent = "所有任務都已完成！"; }
    else if(filter === "done"){ emptyEmoji.textContent = "🗂️"; emptyText.textContent = "還沒有已完成的任務"; }
    else { emptyEmoji.textContent = "✨"; emptyText.textContent = "還沒有任務"; }
  }

  function updateMeta(){
    var total = tasks.length;
    var done = tasks.filter(function(t){return t.done;}).length;
    var remaining = total - done;
    remainingEl.textContent = remaining;
    clearBtn.disabled = (done === 0);
    var pct = total ? Math.round(done/total*100) : 0;
    progFill.style.width = pct + "%";
    pctEl.textContent = pct + "%";
    progText.textContent = done + " / " + total;
  }

  // ---- events ----
  addForm.addEventListener("submit", function(e){
    e.preventDefault();
    addTask(inputEl.value);
  });
  clearBtn.addEventListener("click", clearDone);
  filterBtns.forEach(function(b){
    b.addEventListener("click", function(){
      filter = b.dataset.filter;
      applyFilter();
    });
  });

  // ---- init ----
  initTheme();
  setToday();
  tasks.forEach(function(t, i){
    var li = createItem(t);
    listEl.appendChild(li);
    li.style.animationDelay = (i * 45) + "ms"; // stagger initial reveal
    setTimeout(function(){ li.style.animationDelay = ""; }, 700);
  });
  applyFilter();
  updateMeta();
})();
</script>
</body>
</html>
